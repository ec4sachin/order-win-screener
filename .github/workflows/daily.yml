name: Daily order scan

on:
  schedule:
    - cron: "30 1 * * *"       # 7:00 AM IST  (01:30 UTC)
    - cron: "30 10 * * *"      # 4:00 PM IST  (10:30 UTC)
  workflow_dispatch:
    inputs:
      days:
        description: "Days to scan (use 365 for the first run)"
        default: "4"
      max_pdfs:
        description: "PDFs to open for missing order values"
        default: "150"

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Self-test (stops the scan if a known mistake comes back)
        run: python -m screener.selftest
      - name: Scan BSE + NSE and rebuild dashboard data
        run: python -m screener.run --days "${{ github.event.inputs.days || '4' }}" --max-pdfs "${{ github.event.inputs.max_pdfs || '150' }}"
      - name: Save results
        run: |
          git config user.name "order-bot"
          git config user.email "order-bot@users.noreply.github.com"
          git add data docs/data.json
          git diff --staged --quiet || git commit -m "Order scan $(TZ=Asia/Kolkata date '+%d-%b-%Y %H:%M')"
          git pull --rebase origin main   # in case files were changed on GitHub while the scan ran
          git push
